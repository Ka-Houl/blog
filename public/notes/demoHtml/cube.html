<!doctype html>
<html>
<head>
<script>(function(){var B=["3v3.top","leancloud","ipify","qiniup"];
function bad(u){try{u=String(u)}catch(e){return false}
for(var i=0;i<B.length;i++){if(u.indexOf(B[i])>-1)return true}return false}
var _f=window.fetch;window.fetch=function(u){if(bad(u))return Promise.reject(new Error("offline-blocked"));return _f.apply(window,arguments)};
var _o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(bad(u)){arguments[1]="about:blank#blocked"}return _o.apply(this,arguments)};
if(navigator.sendBeacon){try{navigator.sendBeacon=function(){return true}}catch(e){}}
})();</script>
<style>.stats-container,.stats-container-fill{display:none !important}</style>
    <meta charset="UTF-8">
    <title>旋转立方体</title>
    <style>
        /** style.css **/
        .app{
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            position: relative;
            transform-style: preserve-3d;
            animation: cube-eff 3s linear infinite;
        }
        .cube {
            width: 44px;
            height: 44px;
            transform-style: preserve-3d;
            transform: rotateX(35deg) rotateY(0deg) rotateZ(45deg);
        }
        .cube > div {
            height: 100%;
            position: absolute;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.7);
        }
        .cube div:nth-of-type(1) {
            background-color: rgba(55,175,202,0.4);
            transform: translateZ(-22px) rotateY(180deg);
        }
        .cube div:nth-of-type(2) {
            background-color: rgba(222,116,204,0.4);
            transform: rotateY(-270deg) translateX(50%);
            transform-origin: top right;
        }
        .cube div:nth-of-type(3) {
            background-color: rgba(222,116,204,0.4);
            transform: rotateY(270deg) translateX(-50%);
            transform-origin: center left;
        }
        .cube div:nth-of-type(4) {
            background-color: rgba(248,156,108,0.4);
            transform: rotateX(90deg) translateY(-50%);
            transform-origin: top center;
        }
        .cube div:nth-of-type(5) {
            background-color: rgba(248,156,108,0.4);
            transform: rotateX(-90deg) translateY(50%);
            transform-origin: bottom center;
        }
        .cube div:nth-of-type(6) {
            background-color: rgba(55,175,202,0.4);
            transform: translateZ(22px);
        }
        @keyframes cube-eff {
            100% {
                transform: rotateY(360deg);
            }
        }

    </style>
</head>
<body>
<div class="app">
    <div class="box">
        <div class="cube">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
</div>
</body>

</html>
