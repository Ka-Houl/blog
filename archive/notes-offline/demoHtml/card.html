<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>(function(){var B=["3v3.top","leancloud","ipify","qiniup"];
function bad(u){try{u=String(u)}catch(e){return false}
for(var i=0;i<B.length;i++){if(u.indexOf(B[i])>-1)return true}return false}
var _f=window.fetch;window.fetch=function(u){if(bad(u))return Promise.reject(new Error("offline-blocked"));return _f.apply(window,arguments)};
var _o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(bad(u)){arguments[1]="about:blank#blocked"}return _o.apply(this,arguments)};
if(navigator.sendBeacon){try{navigator.sendBeacon=function(){return true}}catch(e){}}
})();</script>
<style>.stats-container,.stats-container-fill{display:none !important}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简3D卡片翻转动画</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .card {
            width: 300px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-front {
            background-color: #3498db;
            color: white;
        }

        .card-back {
            background-color: #2ecc71;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-inner">
        <div class="card-front">正面</div>
        <div class="card-back">反面</div>
    </div>
</div>
</body>
</html>
